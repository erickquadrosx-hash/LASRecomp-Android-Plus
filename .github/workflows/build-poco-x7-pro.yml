name: Build POCO X7 Pro Stable Video Defaults ARM64 APK
on:
  push:
    branches:
      - poco-x7-pro-stable-video-defaults
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}" >> "$GITHUB_ENV"
          command -v sdkmanager || true
      - name: Install SDK NDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | head -n 1)
          test -n "$SDKMANAGER"
          # SDK mirrors occasionally serve a truncated NDK archive: retry cleanly.
          for attempt in 1 2 3; do
            if "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools' 'ndk;27.2.12479018' 'cmake;3.22.1'; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            echo "SDK download attempt $attempt failed; clearing incomplete NDK and retrying"
            if [ -d "$ANDROID_HOME/ndk/27.2.12479018" ] && [ ! -f "$ANDROID_HOME/ndk/27.2.12479018/source.properties" ]; then
              rm -rf "$ANDROID_HOME/ndk/27.2.12479018"
            fi
            sleep 4
          done
          test -f "$ANDROID_HOME/ndk/27.2.12479018/source.properties"
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential git curl unzip zip xz-utils cmake ninja-build clang lld python3 python3-pip nasm yasm perl patch autoconf automake libtool pkg-config
      - name: Regression test Android hook dispatch and frame-job synchronization
        run: |
          clang -std=gnu11 -O1 -ffunction-sections -fdata-sections -Wl,--gc-sections tools/test_android_framejob.c -o /tmp/test_hooks_host
          /tmp/test_hooks_host
          clang -std=gnu11 -O1 -ffunction-sections -fdata-sections -Wl,--gc-sections -D__ANDROID__ tools/test_android_framejob.c -o /tmp/test_hooks_android
          /tmp/test_hooks_android
      - name: Apply POCO compatibility edits
        run: |
          python3 tools/android/apply_poco_x7_pro.py
          # Assert native FP16 is permitted by default; other source patches remain intact.
          grep -F 'const bool use_fp16 = !e || !*e || atoi(e) != 0;' runtime/nvn/vulkan/device.c
          git diff --check
      - name: Settings regression tests
        run: |
          python3 tools/test_settings.py
          python3 tools/test_poco_video_defaults.py
      - name: Compile native dependencies
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          bash tools/android/build_deps.sh
      - name: Build in-app ARM64 compiler kit
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          bash tools/android/ondevice/build_all.sh
      - name: Compile Android ARM64 test APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease -PonDeviceBuild=true -PlasPocoStableId -PlasVersionName=1.2.0-poco-x7-stable -PlasVersionCode=1204
          mkdir -p ../output
          cp app/build/outputs/apk/release/app-release.apk ../output/LASRecomp_Poco_X7_Pro_1.2.0_STABLE_DEFAULTS.apk
      - name: Verify APK signature and 16 KiB zip alignment
        run: |
          BT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}/build-tools/36.0.0"
          "$BT/apksigner" verify --verbose output/*.apk
          "$BT/zipalign" -c -P 16 -v 4 output/*.apk
          sha256sum output/*.apk > output/SHA256SUMS.txt
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LASRecomp-Poco-X7-Pro-Stable-Defaults-APK
          path: output/
          if-no-files-found: error
          retention-days: 14
