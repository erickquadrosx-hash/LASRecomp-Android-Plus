name: Odyssey X7 V2 - Build public shaderc ARM64
on:
  push:
    branches: [odyssey-poco-x7pro-v2-20261107]
    paths:
      - ".github/workflows/odyssey-v2-shaderc.yml"
  workflow_dispatch:
jobs:
  shaderc-android-arm64:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - name: Check Android SDK and install NDK 28.2
        shell: bash
        run: |
          set -euo pipefail
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"
          test -x "$ANDROID_HOME/ndk/28.2.13676358/ndk-build"
          test -f "$ANDROID_HOME/ndk/28.2.13676358/sources/third_party/shaderc/Android.mk"
      - name: Build official NDK shaderc, glslang and SPIRV-Tools for arm64-v8a
        shell: bash
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/28.2.13676358"
          mkdir -p "$RUNNER_TEMP/shaderc-build"
          cd "$RUNNER_TEMP/shaderc-build"
          "$NDK/ndk-build" NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT="$NDK/sources/third_party/shaderc/Android.mk" \
            APP_STL=c++_static APP_ABI=arm64-v8a APP_PLATFORM=android-30 \
            NDK_LIBS_OUT=libs -j4 shaderc shaderc_util glslang SPIRV-Tools SPIRV-Tools-opt
          for lib in libshaderc.a libshaderc_util.a libglslang.a libOSDependent.a libOGLCompiler.a libHLSL.a libSPIRV.a libSPIRV-Tools-opt.a libSPIRV-Tools.a; do
            test -s "obj/local/arm64-v8a/$lib"
          done
          tar -czf "$GITHUB_WORKSPACE/shaderc-ndk28-arm64.tar.gz" -C obj/local arm64-v8a
          sha256sum "$GITHUB_WORKSPACE/shaderc-ndk28-arm64.tar.gz" > "$GITHUB_WORKSPACE/shaderc-ndk28-arm64.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: Odyssey_V2_Shaderc_ARM64_NDK28_Public_Modules
          path: |
            shaderc-ndk28-arm64.tar.gz
            shaderc-ndk28-arm64.sha256
          retention-days: 14
          if-no-files-found: error
# Only publicly redistributable shader compiler libraries. NO game assets,
# derived lifted executable code, production keys or game binaries.
