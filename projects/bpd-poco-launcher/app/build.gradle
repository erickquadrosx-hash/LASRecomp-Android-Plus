plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.bdpmobile.pocolauncher'
    compileSdk 35
    defaultConfig {
        applicationId 'br.com.bdpmobile.pocolauncher'
        minSdk 29
        targetSdk 34
        versionCode 2
        versionName '0.2.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
