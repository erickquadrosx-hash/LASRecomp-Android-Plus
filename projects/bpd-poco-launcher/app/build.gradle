plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.bdpmobile.pocolauncher'
    compileSdk 35
    defaultConfig {
        applicationId 'br.com.bdpmobile.pocolauncher.roms'
        minSdk 29
        targetSdk 34
        versionCode 3
        versionName '0.3.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
